name: Build and Deploy Dockerized App

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    name: Build and Deploy Dockerized App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub (if pushing the image to Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest

  deploy:
    name: Deploy to EC2
    needs: build_and_deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Copy Docker Compose Files to EC2
      - name: Copy Compose Files to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_KEY }}
          username: ${{ secrets.EC2_USER }}
          port: 22
          source: "docker-compose.yml"  # Replace with the path to your local files
          target: "/home/${{ secrets.EC2_USER }}/"  # Replace with the path on the remote host
                  
      # Step 4: Deploy on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_KEY }}
          username: ${{ secrets.EC2_USER }}
          port: 22
          command_timeout: 30m
          script: |
            echo "Pulling the latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest

            echo "Changing directory to user home..."
            cd /home/${{ secrets.EC2_USER }}

            echo "Shutting down existing containers..."
            docker-compose down

            echo "Removing old Docker images and volumes..."
            docker system prune -af --volumes

            echo "Starting up new containers..."
            docker-compose up -d

            echo "Deployment complete!"

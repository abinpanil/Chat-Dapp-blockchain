name: Build and Deploy Dockerized App

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    name: Build and Deploy Dockerized App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub (if pushing the image to Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest

  deploy:
    name: Deploy to EC2
    needs: build_and_deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Copy Docker Compose Files to EC2
      - name: Copy Compose Files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "docker-compose.yml" # Replace with the path to your local files
          target: "/home/${{ secrets.EC2_USER }}" # Replace with the path on the remote host

      # Step 4: Deploy Docker Compose on EC2
      - name: Deploy Docker Compose on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            echo "Navigating to the target directory..."
            cd /home/${{ secrets.EC2_USER }}

            echo "Stopping existing containers..."
            docker-compose down || true

            echo "Removing old Docker images..."
            docker system prune -af --volumes || true

            echo "Pulling the latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest

            echo "Starting new containers with Docker Compose..."
            ENV_VARS=$(cat <<EOF
            NEXT_PUBLIC_PRIVATE_KEY=${{ secrets.NEXT_PUBLIC_PRIVATE_KEY }}
            NEXT_PUBLIC_DEPLOY_ADDRESS=${{ secrets.NEXT_PUBLIC_DEPLOY_ADDRESS }}
            EOF
            )
            echo "$ENV_VARS" > .env

            docker-compose up -d

            echo "Deployment complete!"

name: Build and Deploy Dockerized App

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    name: Build and Deploy Dockerized App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub (if pushing the image to Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest

  deploy:
    name: Deploy to EC2
    needs: build_and_deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

        # Step 2: Add SSH Key
      - name: Add SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      # Step 2: Copy Docker Compose Files to EC2
      - name: Copy Compose Files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem docker-compose.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/docker-compose.yml

      # Step 4: Deploy on EC2
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            echo "Pulling the latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/blockchain-app:latest

            cd /home/${{ secrets.EC2_USER }}

            echo "Shutting down existing containers..."
            docker-compose down

            echo "Removing old Docker images and volumes..."
            docker system prune -af --volumes

            echo "Starting up new containers..."
            docker-compose up -d

            echo "Deployment complete!"
          EOF
